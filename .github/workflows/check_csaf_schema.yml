name: Check CSAF Schema

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate-csaf-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect changed CSAF documents
        id: detect-changes
        shell: bash
        run: |
          git fetch --no-tags --prune --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

          changed_files=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}" HEAD \
            | grep -E '^csaf/(advisories|vex)/.*\.json$' \
            | grep -v '\.sha512$' \
            || true)

          if [ -z "$changed_files" ]; then
            echo "No changed CSAF documents found"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed CSAF documents:"
          printf '%s\n' "$changed_files"
          printf '%s\n' "$changed_files" > changed_csaf_files.txt
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Install schema validator
        if: steps.detect-changes.outputs.has_changes == 'true'
        run: python -m pip install jsonschema

      - name: Validate CSAF documents
        if: steps.detect-changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          python <<'PY'
          import json
          import sys
          import urllib.request
          from pathlib import Path

          from jsonschema import FormatChecker, validators

          schema_url = "https://docs.oasis-open.org/csaf/csaf/v2.0/os/schemas/csaf_json_schema.json"

          with urllib.request.urlopen(schema_url) as response:
            schema = json.load(response)

          Validator = validators.validator_for(schema)
          Validator.check_schema(schema)
          validator = Validator(schema, format_checker=FormatChecker())

          failed = False
          changed_files = [line.strip() for line in Path("changed_csaf_files.txt").read_text().splitlines() if line.strip()]

          for changed_file in changed_files:
            path = Path(changed_file)
            try:
              with path.open(encoding="utf-8") as document:
                data = json.load(document)
            except json.JSONDecodeError as error:
              print(f"::error file={changed_file},line={error.lineno},col={error.colno}::{error.msg}")
              failed = True
              continue

            errors = sorted(validator.iter_errors(data), key=lambda error: list(error.path))
            if errors:
              failed = True
              for error in errors:
                location = "/".join(str(part) for part in error.absolute_path) or "$"
                print(f"::error file={changed_file},title=CSAF schema validation failed::{location}: {error.message}")
            else:
              print(f"{changed_file}: valid")

          if failed:
            sys.exit(1)
          PY