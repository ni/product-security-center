name: 'Generate CSAF Metadata'
description: 'Generates CSAF metadata files (index.txt and changes.csv)'

inputs:
  directory:
    description: 'Directory name (advisories or vex)'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.x'
    
    - name: Generate metadata files
      shell: bash
      env:
        DIRECTORY: ${{ inputs.directory }}
      run: |
        python scripts/generate_csaf_metadata.py --directory "$DIRECTORY"
